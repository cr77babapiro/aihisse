[project]
name = "trader-bot"
version = "0.1.0"
description = "Akıllı Hisse Senedi Alım-Satım Botu – Cursor Ready"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="Quant AI"}]
dependencies = [
    "pydantic>=2.6","pydantic-settings>=2.5","typer[all]>=0.12","yfinance>=0.2.50","pandas>=2.2","numpy>=1.26","plotly>=5.24","streamlit>=1.39","scikit-learn>=1.5","torch>=2.4","transformers>=4.44","beautifulsoup4>=4.12","requests>=2.32","python-dotenv>=1.0","pandas-ta>=0.3.14b0","matplotlib>=3.9","alpaca-trade-api>=3.2","ibapi>=9.81.1.post1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[project.scripts]
trader-bot = "trader_bot.cli:main"
